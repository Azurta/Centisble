# One-click hosting on Render (https://render.com): New → Blueprint → pick this repo.
# You'll be asked for your Plaid keys. APP_TOKEN is generated for you and is used as the key that encrypts
# stored bank connections: never change or delete it. Everyone signs in with their own email + password.
services:
  - type: web
    name: centsible
    runtime: node
    plan: starter # the persistent disk below needs a paid instance
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PLAID_ENV
        value: production
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: APP_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID # optional: "Continue with Google"
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY # optional: "Forgot password?" emails
        sync: false
      - key: EMAIL_FROM # e.g. Centsible <hello@yourdomain.com>
        sync: false
      - key: POLL_MINUTES
        value: "30"
    disk:
      name: centsible-data
      mountPath: /var/data
      sizeGB: 1
